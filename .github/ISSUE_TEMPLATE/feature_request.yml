name: Feature request
description: Suggest an improvement to the provider
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternatives.
  - type: checkboxes
    id: boundary
    attributes:
      label: Architecture
      options:
        - label: The proposal preserves Copilot as the tool and workspace-action executor.
          required: true